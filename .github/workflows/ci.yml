name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    # Fijar la versión evita migraciones automáticas de ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Redis permite ejecutar las pruebas de cuotas y caché entre réplicas.
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage
        env:
          REDIS_URL: redis://localhost:6379

      - name: Validate Compose configuration
        run: pnpm test:compose

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            packages/*/coverage
            apps/*/coverage
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 7
