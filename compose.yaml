# Servicios de apoyo para desarrollo local.
#   docker compose up -d --wait redis
# Redis guarda los contadores de cuotas y la caché compartida entre réplicas.
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
